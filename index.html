<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematik Terimleri Tekerlemeleri — Giresun Üniversitesi</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4efe5;
  --bg2:#ece5d6;
  --surface:#ffffff;
  --surface2:#faf6ef;
  --ink:#1a1205;
  --ink2:#5a4f3e;
  --ink3:#9e9080;
  --accent:#c04010;
  --accent-l:#faeee7;
  --accent2:#1d5c3a;
  --accent2-l:#e6f0eb;
  --gold:#b8860b;
  --gold-l:#fdf6e3;
  --border:#ddd4c4;
  --border2:#c8bfb0;
  --radius:14px;
  --shadow:0 4px 24px rgba(28,20,8,.09);
  --shadow-lg:0 12px 48px rgba(28,20,8,.16);
  --hero-bg:#0f0b04;
  --hero-gradient1:rgba(192,64,16,.22);
  --hero-gradient2:rgba(29,92,58,.18);
  --hero-gradient3:rgba(184,134,11,.12);
  --hero-star-opacity:.06;
  --sky-top:#1a3a6e;
  --sky-mid:#4a6fa8;
  --transition-dur:.55s;
}
[data-theme=dark]{
  --bg:#0e0a04;
  --bg2:#17120a;
  --surface:#1c1710;
  --surface2:#241e14;
  --ink:#f0e8d8;
  --ink2:#c4b89e;
  --ink3:#7a6e5e;
  --accent:#e05a28;
  --accent-l:#2a1508;
  --accent2:#3aae6e;
  --accent2-l:#0a2018;
  --gold:#d4a820;
  --gold-l:#1e1800;
  --border:#3a3020;
  --border2:#4a4030;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --shadow-lg:0 12px 48px rgba(0,0,0,.65);
  --hero-bg:#050300;
  --hero-gradient1:rgba(220,80,30,.2);
  --hero-gradient2:rgba(40,120,70,.15);
  --hero-gradient3:rgba(200,150,20,.12);
  --hero-star-opacity:.14;
  --sky-top:#060510;
  --sky-mid:#0a0818;
  --transition-dur:.55s;
}

html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background var(--transition-dur) ease,color var(--transition-dur) ease}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── HERO ── */
.hero{
  background:var(--hero-bg);
  color:#f0e8d8;
  padding:0;
  position:relative;
  overflow:hidden;
  min-height:360px;
  display:flex;
  flex-direction:column;
  transition:background var(--transition-dur) ease;
}

/* Sky gradient that shifts with day/night */
.hero::before{
  content:'';
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, var(--sky-top) 0%, transparent 70%);
  transition:all var(--transition-dur) ease;
  z-index:0;
}

.hero-pattern{
  position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 15% 55%, var(--hero-gradient1) 0%, transparent 50%),
    radial-gradient(circle at 85% 20%, var(--hero-gradient2) 0%, transparent 45%),
    radial-gradient(circle at 60% 90%, var(--hero-gradient3) 0%, transparent 40%);
  transition:all var(--transition-dur) ease;
  z-index:1;
}

/* Star field – visible in dark mode */
.hero-stars{
  position:absolute;inset:0;
  z-index:1;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,var(--hero-star-opacity)) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 8%, rgba(255,255,255,var(--hero-star-opacity)) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,var(--hero-star-opacity)) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 5%, rgba(255,255,255,var(--hero-star-opacity)) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,var(--hero-star-opacity)) 0%, transparent 100%),
    radial-gradient(2px 2px at 82% 10%, rgba(255,255,255,var(--hero-star-opacity)) 0%, transparent 100%),
    radial-gradient(1px 1px at 93% 22%, rgba(255,255,255,var(--hero-star-opacity)) 0%, transparent 100%),
    radial-gradient(1px 1px at 5% 35%, rgba(255,255,255,calc(var(--hero-star-opacity)*.7)) 0%, transparent 100%),
    radial-gradient(1px 1px at 18% 42%, rgba(255,255,255,calc(var(--hero-star-opacity)*.7)) 0%, transparent 100%),
    radial-gradient(1px 1px at 33% 30%, rgba(255,255,255,calc(var(--hero-star-opacity)*.7)) 0%, transparent 100%),
    radial-gradient(1px 1px at 48% 38%, rgba(255,255,255,calc(var(--hero-star-opacity)*.7)) 0%, transparent 100%),
    radial-gradient(1px 1px at 63% 28%, rgba(255,255,255,calc(var(--hero-star-opacity)*.7)) 0%, transparent 100%),
    radial-gradient(1px 1px at 77% 35%, rgba(255,255,255,calc(var(--hero-star-opacity)*.7)) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 88% 30%, rgba(255,255,255,calc(var(--hero-star-opacity)*1.2)) 0%, transparent 100%);
  transition:all var(--transition-dur) ease;
}

.hero-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(240,232,216,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(240,232,216,.03) 1px, transparent 1px);
  background-size:44px 44px;
  z-index:1;
}

.hero-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1.5rem 2.5rem 0;
  position:relative;z-index:3;
}
.uni-brand{
  display:flex;align-items:center;gap:14px;
}
.uni-logo{
  width:68px;height:68px;flex-shrink:0;
  border-radius:50%;
  box-shadow:0 0 0 2px rgba(200,160,64,.4), 0 4px 20px rgba(0,0,0,.6);
  transition:transform .35s ease, box-shadow .35s ease;
  object-fit:cover;
}
.uni-logo:hover{
  transform:scale(1.07) rotate(-2deg);
  box-shadow:0 0 0 3px rgba(200,160,64,.7), 0 6px 28px rgba(0,0,0,.7);
}
.uni-text{}
.uni-name{
  font-family:'Cormorant Garamond',serif;
  font-size:1.05rem;font-weight:600;
  color:#f0e8d8;
  line-height:1.2;
  letter-spacing:0.02em;
}
.uni-sub{
  font-size:0.72rem;font-weight:300;
  color:rgba(240,232,216,.55);
  letter-spacing:0.12em;
  text-transform:uppercase;
  margin-top:1px;
}

.theme-toggle{
  background:rgba(240,232,216,.08);
  border:1px solid rgba(240,232,216,.18);
  border-radius:50px;
  padding:.45rem 1rem .45rem .55rem;
  cursor:pointer;
  font-family:'Outfit',sans-serif;
  font-size:0.78rem;
  color:rgba(240,232,216,.75);
  display:flex;align-items:center;gap:8px;
  transition:all .25s ease;
  backdrop-filter:blur(8px);
  position:relative;overflow:hidden;
}
.theme-toggle:hover{
  background:rgba(240,232,216,.16);
  color:#f0e8d8;
  border-color:rgba(240,232,216,.3);
}
/* The animated sun/moon orb */
.toggle-orb{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;
  transition:all var(--transition-dur) ease;
  flex-shrink:0;
}
[data-theme=light] .toggle-orb{
  background:rgba(255,220,60,.2);
  box-shadow:0 0 8px rgba(255,220,60,.4);
}
[data-theme=dark] .toggle-orb{
  background:rgba(180,200,255,.12);
  box-shadow:0 0 8px rgba(150,180,255,.3);
}

.hero-body{
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2.5rem 2rem 3rem;
  position:relative;z-index:3;
  text-align:center;
}
.hero-eyebrow{
  font-size:.75rem;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;
  color:rgba(240,232,216,.45);
  margin-bottom:1rem;
}
.hero-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2.4rem,6vw,4.2rem);
  font-weight:700;
  line-height:1.06;
  letter-spacing:-.025em;
  color:#f0e8d8;
  text-shadow:0 2px 30px rgba(0,0,0,.5);
}
.hero-title em{
  font-style:italic;
  background:linear-gradient(135deg,#e07040 0%,#ff9050 60%,#e07040 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero-desc{
  margin-top:1rem;
  font-size:.95rem;font-weight:300;
  color:rgba(240,232,216,.5);
  max-width:480px;
  line-height:1.6;
}


/* ── STATS BAR ── */
.stats-bar{
  display:grid;
  grid-template-columns:1fr;
  background:rgba(0,0,0,.25);
  border-top:1px solid rgba(240,232,216,.07);
  position:relative;z-index:3;
  backdrop-filter:blur(4px);
  transition:background var(--transition-dur) ease;
}
.stat-item{
  padding:1.1rem 1.5rem;
  text-align:center;
  border-right:1px solid rgba(240,232,216,.07);
  position:relative;
  transition:background .2s ease;
}
.stat-item:hover{background:rgba(240,232,216,.04)}
.stat-item:last-child{border-right:none}
.stat-num{
  font-family:'Cormorant Garamond',serif;
  font-size:2rem;font-weight:700;
  color:var(--accent);
  line-height:1;
  text-shadow:0 2px 12px rgba(var(--accent),.3);
}
.stat-label{
  font-size:.68rem;font-weight:400;
  color:rgba(240,232,216,.38);
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-top:4px;
}

/* ── TOOLBAR ── */
.toolbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:1rem 2rem;
  display:flex;align-items:center;gap:.75rem;
  flex-wrap:wrap;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 16px rgba(28,20,8,.10);
  transition:background var(--transition-dur) ease, border-color var(--transition-dur) ease, box-shadow var(--transition-dur) ease;
}
.search-wrap{
  flex:1;min-width:200px;
  display:flex;align-items:center;gap:8px;
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:.5rem 1rem;
  transition:border-color .2s,box-shadow .2s;
}
.search-wrap:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(176,58,10,.1);
}
.search-wrap svg{color:var(--ink3);flex-shrink:0}
.search-wrap input{
  border:none;background:transparent;
  font-family:'Outfit',sans-serif;font-size:.9rem;
  color:var(--ink);outline:none;width:100%;
}
.search-wrap input::placeholder{color:var(--ink3)}



.sort-select{
  background:var(--bg);
  border:1.5px solid var(--border);
  border-radius:8px;
  padding:.35rem .75rem;
  font-family:'Outfit',sans-serif;font-size:.78rem;
  color:var(--ink2);cursor:pointer;outline:none;
}
.count-lbl{
  margin-left:auto;font-size:.78rem;
  color:var(--ink3);white-space:nowrap;
}

/* ── MAIN GRID ── */
main{
  max-width:960px;margin:0 auto;
  padding:2.5rem 1.5rem 5rem;
  display:grid;gap:1.25rem;
}

/* ── CARD ── */
.card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:box-shadow .3s ease,transform .3s ease,border-color .3s ease,opacity .4s ease,background var(--transition-dur) ease;
  animation:slideUp .4s cubic-bezier(.16,1,.3,1) both;
}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--border2)}
.card.hidden{display:none}

.card-header{
  display:flex;align-items:flex-start;gap:1rem;
  padding:1.25rem 1.5rem;
  cursor:pointer;user-select:none;
  transition:background .15s;
}
.card-header:hover{background:var(--surface2)}

.num-badge{
  width:42px;height:42px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#e86030);
  color:#fff;
  font-size:1rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-family:'Cormorant Garamond',serif;
  box-shadow:0 3px 12px rgba(176,58,10,.35);
  transition:transform .2s ease, box-shadow .2s ease;
}
.card:hover .num-badge{
  transform:scale(1.05);
  box-shadow:0 5px 16px rgba(176,58,10,.45);
}
.card-meta{flex:1;min-width:0}
.card-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.3rem;font-weight:700;
  color:var(--ink);line-height:1.2;
}


.card-preview{
  font-size:.8rem;color:var(--ink3);
  margin-top:.3rem;
  font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-icons{
  display:flex;align-items:center;gap:.4rem;flex-shrink:0;
}
.icon-btn{
  background:none;border:none;cursor:pointer;
  color:var(--ink3);padding:.3rem;border-radius:6px;
  transition:color .15s,background .15s;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{color:var(--accent);background:var(--accent-l)}
.icon-btn.fav-on{color:#e05050}
.chevron{transition:transform .25s}
.card.open .chevron{transform:rotate(180deg)}

/* ── CARD BODY ── */
.card-body{
  display:none;
  border-top:1.5px solid var(--border);
}
.card.open .card-body{display:block}

.sec{
  padding:1.25rem 1.5rem;
  border-bottom:1px solid var(--border);
}
.sec:last-child{border-bottom:none}
.sec-label{
  font-size:.65rem;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:.65rem;
  display:flex;align-items:center;gap:.4rem;
}
.sec-label::after{
  content:'';flex:1;height:1px;
  background:var(--border);
}

.def-text{
  font-size:.9rem;color:var(--ink2);
  line-height:1.75;
}

.poem-card{
  background:var(--bg);
  border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;
  padding:1.1rem 1.3rem;
  font-family:'Cormorant Garamond',serif;
  font-size:1.08rem;line-height:1.9;
  color:var(--ink);
  white-space:pre-line;
  position:relative;
}
.poem-card::before{
  content:'"';
  position:absolute;top:-.3rem;left:.8rem;
  font-size:4rem;font-family:'Cormorant Garamond',serif;
  color:var(--accent);opacity:.18;line-height:1;
}

.edit-btn-row{display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap}
.btn{
  font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:500;
  padding:.38rem .9rem;border-radius:7px;
  border:1.5px solid var(--border);cursor:pointer;
  transition:all .15s;color:var(--ink2);background:transparent;
}
.btn:hover{border-color:var(--ink2)}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-pri:hover{background:#8f2e07}
.btn-danger{color:#c0392b;border-color:rgba(192,57,43,.3)}
.btn-danger:hover{background:rgba(192,57,43,.08)}

.edit-textarea{
  width:100%;
  font-family:'Cormorant Garamond',serif;
  font-size:1.05rem;line-height:1.8;
  border:2px solid var(--accent);
  border-radius:10px;
  padding:.85rem 1.1rem;
  background:var(--accent-l);
  color:var(--ink);resize:vertical;
  min-height:130px;outline:none;
  transition:box-shadow .2s;
}
.edit-textarea:focus{box-shadow:0 0 0 4px rgba(176,58,10,.12)}

.expl-text{font-size:.88rem;color:var(--ink2);line-height:1.7}
.expl-text strong{color:var(--accent2);font-weight:500}

.src-list{list-style:none;display:flex;flex-direction:column;gap:.4rem}
.src-list li{
  font-size:.78rem;color:var(--ink3);
  padding:.3rem .6rem .3rem .8rem;
  background:var(--surface2);
  border-left:2px solid var(--border2);
  border-radius:0 5px 5px 0;
}
.src-list a{color:var(--accent2);text-decoration:none}
.src-list a:hover{text-decoration:underline}



/* ── FAV SECTION ── */
.fav-bar{
  background:var(--gold-l);
  border:1.5px solid rgba(184,134,11,.25);
  border-radius:var(--radius);
  padding:1rem 1.5rem;
  display:none;
  align-items:center;gap:.75rem;
}
.fav-bar.visible{display:flex}
.fav-bar-text{font-size:.85rem;color:var(--gold);font-weight:500}
.fav-chips{display:flex;gap:.4rem;flex-wrap:wrap;flex:1}
.fav-chip{
  background:rgba(184,134,11,.15);
  border:1px solid rgba(184,134,11,.3);
  border-radius:6px;padding:.2rem .6rem;
  font-size:.75rem;color:var(--gold);
  cursor:pointer;transition:all .15s;
}
.fav-chip:hover{background:rgba(184,134,11,.28)}

/* ── NO RESULTS ── */
.empty{
  text-align:center;padding:4rem 2rem;
  color:var(--ink3);
  font-family:'Cormorant Garamond',serif;
  font-size:1.15rem;font-style:italic;
  display:none;
}

/* ── PROGRESS BAR ── */
.read-progress{
  position:fixed;top:0;left:0;height:3px;
  background:linear-gradient(90deg,var(--accent),#f08040,var(--gold));
  z-index:1000;
  transition:width .1s;width:0;
  box-shadow:0 0 8px rgba(192,64,16,.5);
}

/* ── BACK TO TOP ── */
.back-top{
  position:fixed;bottom:2rem;right:2rem;
  background:var(--ink);color:var(--bg);
  border:none;border-radius:50px;
  padding:.6rem 1.1rem;cursor:pointer;
  font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:500;
  display:flex;align-items:center;gap:.4rem;
  box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(14px) scale(.95);
  transition:opacity .3s ease,transform .3s ease,background .2s ease;
  pointer-events:none;z-index:200;
  backdrop-filter:blur(4px);
}
.back-top.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.back-top:hover{background:var(--accent);transform:translateY(-2px) scale(1);box-shadow:0 8px 24px rgba(192,64,16,.4)}

/* ── FOOTER ── */
footer{
  background:var(--hero-bg);
  color:rgba(240,232,216,.3);
  text-align:center;
  padding:2.75rem 2rem;
  font-size:.78rem;line-height:1.8;
  border-top:1px solid rgba(240,232,216,.06);
  transition:background var(--transition-dur) ease;
}
footer strong{color:rgba(240,232,216,.65);font-weight:500}
footer .footer-logo{margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:.75rem}

/* ── MOBILE ── */
@media(max-width:640px){

  .hero-top{padding:1rem 1.25rem 0}
  .uni-logo{width:48px;height:48px}
  main{padding:1.5rem 1rem 4rem}
  .sec{padding:1rem}
  .card-header{padding:1rem}
  .toolbar{padding:.75rem 1rem}
}
</style>
</head>
<body>

<div class="read-progress" id="readProgress"></div>

<!-- HERO -->
<header class="hero">
  <div class="hero-pattern"></div>
  <div class="hero-grid"></div>
  <div class="hero-stars"></div>

/* ── STATE ── */
let edits = (() => { try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||{} }catch{return{}} })();
let favs  = (() => { try{ return JSON.parse(localStorage.getItem(FAV_KEY))||[] }catch{return[]} })();
let currentSort='num';
let items=[...RAW];

function saveEdits(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(edits)) }
function saveFavs(){ localStorage.setItem(FAV_KEY,JSON.stringify(favs)) }
function getPoem(item){ return edits[item.id]!==undefined?edits[item.id]:item.poem }

/* ── THEME ── */
function toggleTheme(){
  const d=document.documentElement;
  const dark=d.getAttribute('data-theme')==='dark';
  const newTheme=dark?'light':'dark';
  d.setAttribute('data-theme',newTheme);
  updateThemeUI(newTheme);
  localStorage.setItem('guTheme',newTheme);
}

function updateThemeUI(theme){
  const isDark=theme==='dark';
  const icon=document.getElementById('themeIcon');
  const txt=document.getElementById('themeTxt');
  if(icon){ icon.textContent=isDark?'☀️':'🌙'; }
  if(txt){ txt.textContent=isDark?'Açık Tema':'Koyu Tema'; }
}

(function(){
  const t=localStorage.getItem('guTheme');
  if(t==='dark'){
    document.documentElement.setAttribute('data-theme','dark');
    document.addEventListener('DOMContentLoaded',()=>updateThemeUI('dark'));
  } else {
    document.addEventListener('DOMContentLoaded',()=>updateThemeUI('light'));
  }
})();

/* ── RENDER ── */
function render(){
  const list=document.getElementById('cardList');
  list.innerHTML='';
  let sorted=[...items];
  if(currentSort==='az') sorted.sort((a,b)=>a.title.localeCompare(b.title,'tr'));
  else if(currentSort==='za') sorted.sort((a,b)=>b.title.localeCompare(a.title,'tr'));
  else sorted.sort((a,b)=>a.num-b.num);

  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  let vis=0;

  sorted.forEach((item,idx)=>{
    const poem=getPoem(item);
    const isEdited=edits[item.id]!==undefined;
    const isFav=favs.includes(item.id);
    const matchQ=!q||item.title.toLowerCase().includes(q)||poem.toLowerCase().includes(q)||item.def.toLowerCase().includes(q);
    const show=matchQ;
    if(!show) return;
    vis++;

    const preview=poem.split('\n')[0].slice(0,52)+(poem.length>52?'…':'');

    const srcHtml=item.src.map(s=>{
      const isUrl=s.startsWith('http');
      if(!isUrl) return `<li>${s}</li>`;
      let label=s;
      if(s.includes('tr.wikipedia.org')) label='Vikipedi (Türkçe)';
      else if(s.includes('en.wikipedia.org')) label='Wikipedia (İngilizce)';
      else if(s.includes('mathworld.wolfram.com')) label='Wolfram MathWorld';
      else if(s.includes('sozluk.tmd.org.tr')) label='TMD Terimler Sözlüğü';
      else if(s.includes('tmd.org.tr')) label='Türk Matematik Derneği';
      else try{ label=new URL(s).hostname.replace('www.',''); }catch(e){}
      return `<li><a href="${s}" target="_blank" rel="noopener">${label} ↗</a></li>`;
    }).join('');

    const card=document.createElement('div');
    card.className='card';
    card.dataset.id=item.id;
    card.style.animationDelay=`${idx*0.04}s`;

    card.innerHTML=`
      <div class="card-header" onclick="toggleCard(${item.id},event)">
        <div class="num-badge">${item.num}</div>
        <div class="card-meta">
          <div class="card-title">${item.title}</div>
          <div class="card-preview">${preview}</div>
        </div>
        <div class="card-icons" onclick="event.stopPropagation()">
          <button class="icon-btn ${isFav?'fav-on':''}" title="${isFav?'Favoriden çıkar':'Favoriye ekle'}" onclick="toggleFav(${item.id},this)">
            ${isFav?'★':'☆'}
          </button>
          <button class="icon-btn" title="Kopyala" onclick="copyPoem(${item.id},this)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="icon-btn chevron">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </div>
      <div class="card-body">
        <div class="sec">
          <div class="sec-label">Tanım</div>
          <div class="def-text">${item.def}</div>
        </div>
        <div class="sec">
          <div class="sec-label">Tekerleme</div>
          <div class="poem-card" id="poem-${item.id}">${poem}</div>
          <div class="edit-btn-row" id="view-btns-${item.id}">
            <button class="btn" onclick="startEdit(${item.id})">✏ Düzenle</button>
            ${isEdited?`<button class="btn btn-danger" onclick="resetPoem(${item.id})">↺ Orijinale dön</button>`:''}
          </div>
          <div id="edit-wrap-${item.id}" style="display:none">
            <textarea class="edit-textarea" id="ta-${item.id}">${poem}</textarea>
            <div class="edit-btn-row">
              <button class="btn btn-pri" onclick="savePoem(${item.id})">✓ Kaydet</button>
              <button class="btn" onclick="cancelEdit(${item.id})">İptal</button>
            </div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-label">Açıklama</div>
          <div class="expl-text">${item.expl}</div>
        </div>
        <div class="sec">
          <div class="sec-label">Kaynaklar</div>
          <ul class="src-list">${srcHtml}</ul>
        </div>
      </div>`;
    list.appendChild(card);
  });

  document.getElementById('emptyMsg').style.display=vis===0?'block':'none';
  document.getElementById('countLbl').textContent=vis+' terim';
}

function toggleCard(id,e){
  if(e&&e.target.closest('.card-icons')) return;
  const c=document.querySelector(`.card[data-id="${id}"]`);
  c.classList.toggle('open');
}

/* ── EDIT ── */
function startEdit(id){
  document.getElementById(`poem-${id}`).style.display='none';
  document.getElementById(`view-btns-${id}`).style.display='none';
  document.getElementById(`edit-wrap-${id}`).style.display='block';
  document.getElementById(`ta-${id}`).focus();
}
function cancelEdit(id){
  document.getElementById(`poem-${id}`).style.display='';
  document.getElementById(`view-btns-${id}`).style.display='';
  document.getElementById(`edit-wrap-${id}`).style.display='none';
}
function savePoem(id){
  edits[id]=document.getElementById(`ta-${id}`).value;
  saveEdits();
  const wasOpen=document.querySelector(`.card[data-id="${id}"]`).classList.contains('open');
  render();
  if(wasOpen) setTimeout(()=>{ const c=document.querySelector(`.card[data-id="${id}"]`); if(c)c.classList.add('open'); },20);
}
function resetPoem(id){
  if(!confirm('Orijinal tekerlemeye döndürülsün mü?')) return;
  delete edits[id];
  saveEdits();
  const wasOpen=document.querySelector(`.card[data-id="${id}"]`).classList.contains('open');
  render();
  if(wasOpen) setTimeout(()=>{ const c=document.querySelector(`.card[data-id="${id}"]`); if(c)c.classList.add('open'); },20);
}

/* ── COPY ── */
function copyPoem(id,btn){
  const text=getPoem(RAW.find(x=>x.id===id));
  navigator.clipboard.writeText(text).then(()=>{
    const orig=btn.innerHTML;
    btn.innerHTML='✓';
    btn.style.color='var(--accent2)';
    setTimeout(()=>{ btn.innerHTML=orig; btn.style.color=''; },1500);
  });
}

/* ── FAVS ── */
function toggleFav(id,btn){
  const idx=favs.indexOf(id);
  if(idx===-1){ favs.push(id); btn.textContent='★'; btn.classList.add('fav-on'); btn.title='Favoriden çıkar'; }
  else{ favs.splice(idx,1); btn.textContent='☆'; btn.classList.remove('fav-on'); btn.title='Favoriye ekle'; }
  saveFavs();
}

/* ── FILTER & SORT ── */
function filterAll(){ render() }
function sortCards(v){ currentSort=v; render() }


/* ── SCROLL ── */
window.addEventListener('scroll',()=>{
  const prog=document.getElementById('readProgress');
  const top=document.documentElement.scrollTop;
  const total=document.documentElement.scrollHeight-window.innerHeight;
  prog.style.width=(total>0?(top/total*100):0)+'%';
  const btn=document.getElementById('backTop');
  if(top>400){ btn.classList.add('show') } else { btn.classList.remove('show') }
});

/* ── KEYBOARD SHORTCUT ── */
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

render();
</script>
</body>
</html>
